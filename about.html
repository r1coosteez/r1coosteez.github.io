<!DOCTYPE html>
<html>
<head>
  <title>About Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="css/r2os.css">
</head>

<body>

  <h1>About Me</h1>
  <p>
    I'm a high school student interested in cybersecurity, programming, fashion, music production, and the esports scene. I'm interested in building real technical skills early on.
  </p>

<section id="about-terminal"
<div class="r2window" id="term-window" style="left:80px; top:80px;">
  <div class="title"><div class="name">Terminal</div><div class="controls">...</div></div>
  <div class="terminal" id="r2terminal">
    <div class="terminal-output" aria-live="polite"></div>
    <div class="input-line"><span>$</span><input autocomplete="off" aria-label="Terminal input"></div>
  </div>
</div>

  
  <div class="terminal-buttons">
    <button data-command="skills">Skills</button>
    <button data-command="experience">Experience</button>
    <button data-command="goals">Goals</button>
    <button data-command="interests">Interests</button>
  </div>

<div class="sub-buttons" id="sub-buttons" style="display:none;"
    <button data-sub="esports">Esports</button>
    <button data-sub="fashion">Fashion</button>
    <button data-sub="music">Beats</button>
</div>
</section>
  
<a href="index.html" class="back-btn terminal-back">&larr; Back to Home</a>
<script src="js/draggable.js"></script>
<script src="js/terminal.js"></script>
<script src="js/r2os.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', ()=>{
    // If r2os.js creates the terminal window, init Terminal from r2os.init()
    Terminal.init('#r2terminal');
    r2os.init();
  });
</script>

</body>
</html>
